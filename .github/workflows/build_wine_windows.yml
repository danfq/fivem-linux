name: Build patched FiveM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    env:
      CFX_PRODUCT_NAME: fivem
      CFX_DRY_RUN: "true"
      CFX_RETAIL_BUILD: "false"

      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Force node-gyp to Python 3.11
        shell: pwsh
        run: |
          $python = (Get-Command python).Source

          echo "PYTHON=$python" >> $env:GITHUB_ENV
          echo "npm_config_python=$python" >> $env:GITHUB_ENV

          python -m pip install --upgrade pip
          python -m pip install setuptools

      - name: Install Windows 11 SDK 22000
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkVersion = '10.0.22000.0'
          $sdkComponent = 'Microsoft.VisualStudio.Component.Windows11SDK.22000'
          $vsInstallerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $vsInstallerDir 'vswhere.exe'
          $installer = Join-Path $vsInstallerDir 'setup.exe'

          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio Installer discovery tool was not found: $vswhere"
          }

          if (-not (Test-Path $installer)) {
            throw "Visual Studio Installer was not found: $installer"
          }

          $installationPath = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1).Trim()

          if (-not $installationPath) {
            throw "A Visual Studio installation with C++ tools was not found"
          }

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $sdkLib = Join-Path $sdkRoot "Lib\$sdkVersion"
          $sdkInclude = Join-Path $sdkRoot "Include\$sdkVersion\um\Windows.h"

          if (-not ((Test-Path $sdkLib) -and (Test-Path $sdkInclude))) {
            Write-Host "Installing $sdkComponent into $installationPath"

            $process = Start-Process -FilePath $installer `
              -ArgumentList @(
                'modify'
                '--installPath', $installationPath
                '--add', $sdkComponent
                '--quiet'
                '--norestart'
              ) `
              -Wait `
              -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Windows SDK installation failed with exit code $($process.ExitCode)"
            }
          }

          if (-not ((Test-Path $sdkLib) -and (Test-Path $sdkInclude))) {
            throw "Windows SDK $sdkVersion is unavailable after installation. Expected '$sdkLib' and '$sdkInclude'."
          }

          Write-Host "Verified Windows SDK $sdkVersion at $sdkRoot"

      - name: Build FiveM client
        shell: pwsh
        run: |
          .\code\tools\ci\build_client.ps1

      - name: Upload caches
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fivem-build-output
          path: |
            caches/**
            .build-cache/**
            code/bin/**
