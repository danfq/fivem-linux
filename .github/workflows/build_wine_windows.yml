name: Build patched FiveM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    env:
      CFX_PRODUCT_NAME: fivem
      CFX_DRY_RUN: "true"
      CFX_RETAIL_BUILD: "false"

      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Force node-gyp to Python 3.11
        shell: pwsh
        run: |
          $python = (Get-Command python).Source

          echo "PYTHON=$python" >> $env:GITHUB_ENV
          echo "npm_config_python=$python" >> $env:GITHUB_ENV

          python -m pip install --upgrade pip
          python -m pip install setuptools

      - name: Install Windows 10 SDK 22000
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $installationPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $installationPath) {
            throw "Visual Studio installation was not found"
          }

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          & $installer modify `
            --installPath "$installationPath" `
            --add Microsoft.VisualStudio.Component.Windows11SDK.22000 `
            --quiet `
            --wait `
            --norestart

          if ($LASTEXITCODE -ne 0) {
            throw "Windows SDK installation failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.22000.0")) {
            throw "Windows SDK 10.0.22000.0 was not installed"
          }

      - name: Build FiveM client
        shell: pwsh
        run: |
          .\code\tools\ci\build_client.ps1

      - name: Upload caches
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fivem-build-output
          path: |
            caches/**
            .build-cache/**
            code/bin/**
