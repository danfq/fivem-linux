name: Build patched FiveM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    env:
      CFX_PRODUCT_NAME: fivem
      CFX_DRY_RUN: "true"
      CFX_RETAIL_BUILD: "false"

      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Force node-gyp to Python 3.11
        shell: pwsh
        run: |
          $python = (Get-Command python).Source

          echo "PYTHON=$python" >> $env:GITHUB_ENV
          echo "npm_config_python=$python" >> $env:GITHUB_ENV

          python -m pip install --upgrade pip
          python -m pip install setuptools

      - name: Build FiveM client
        shell: pwsh
        run: |
          .\code\tools\ci\build_client.ps1

      - name: Upload caches
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fivem-build-output
          path: |
            caches/**
            .build-cache/**
            code/bin/**
